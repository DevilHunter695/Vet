name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-and-run:
    # iOS 26 needs an Xcode that ships that SDK. macos-15 images top out
    # below that, so the job asks for the newest image and falls back is not
    # possible in Actions — if this label is unavailable the job will not
    # start, which is a clearer signal than a build failing on a missing SDK.
    runs-on: macos-26
    # 25 was too tight once the suite grew: the app build takes ~6 min and the
    # test target's own build-for-testing another ~10, so the job was finishing
    # with no headroom.
    # Build ~10 + unit ~2 + UI walkthrough ~13 leaves this comfortable, but
    # only just; raising the per-step build cap without raising this one
    # would trade a build timeout for a job timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode available
        # The project targets iOS 26, which needs an Xcode that ships that
        # SDK. Runner images carry several Xcodes and default to one that may
        # not be the newest, so pick the highest-versioned one explicitly
        # rather than inheriting whatever the image happens to select.
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$newest" ]; then
            echo "Selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Show available Xcode versions and simulators
        run: |
          ls /Applications | grep Xcode || true
          xcodebuild -version
          echo "--- SDKs ---"
          xcodebuild -showsdks || true
          xcrun simctl list devices available

      # The app runs on mock repositories, so nothing in the Swift suite ever
      # touches the database schema: 462 unit tests can be green while
      # book_visit() - the transaction every booking goes through - is broken.
      # This applies all 64 migrations to a throwaway Postgres and runs the
      # behaviour tests against it.
      - name: Schema and migration tests
        run: |
          brew install postgresql@16 || true
          export PGBIN="$(brew --prefix postgresql@16)/bin"
          scripts/test-migrations.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Seed build configuration
        run: |
          # The real Config.xcconfig is gitignored. CI builds against the empty
          # SUPABASE_* defaults (mock data) on purpose, but project.yml now
          # references the file, so it has to exist for xcodegen.
          [ -f Config.xcconfig ] || printf 'SUPABASE_URL =\nSUPABASE_ANON_KEY =\n' > Config.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project VetCircuit.xcodeproj

      - name: Pick and boot an available iOS Simulator
        id: destination
        timeout-minutes: 5
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Using device $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"

          for i in $(seq 1 30); do
            STATE=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['state'] for v in d.values() for x in v if x['udid'] == '$DEVICE_ID'), 'Unknown'))")
            echo "Simulator state: $STATE"
            if [ "$STATE" = "Booted" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Simulator did not reach Booted state in time" >&2
          exit 1

      - name: Build
        # Was 10, sized when the app built in ~6 minutes on Xcode 16. On
        # Xcode 26 with a larger codebase it now runs close enough to that
        # cap that it trips intermittently — commit fbd99b7 died here with no
        # compiler errors at all, swift-frontend killed mid-compile, and the
        # very next commit containing the same code built cleanly. A timeout
        # that reports as "Build -> failure" with an empty error list is a
        # false red that costs a real investigation each time.
        timeout-minutes: 25
        run: |
          # Tee'd so the verdict step below can surface the compiler errors.
          # A failed build prints its errors thousands of lines before the end
          # of the job log, and the log API only returns the tail — so the one
          # thing you need after a red build was the one thing you could not
          # read without downloading the whole log.
          set -o pipefail
          xcodebuild build \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Install and launch app on the booted simulator
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.destination.outputs.id }}"
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "VetCircuit.app" | head -1)
          echo "App path: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.vetcircuit.app
          sleep 5

          mkdir -p artifacts
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/vetcircuit-simulator.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vetcircuit-simulator-screenshot
          path: artifacts/vetcircuit-simulator.png

      - name: Unit tests
        # Executing the tests takes ~12 seconds; the rest is building the test
        # target. At 10 minutes xcodebuild was being killed during teardown,
        # before it printed `** TEST SUCCEEDED **` / `** TEST FAILED **` — and
        # because this step is `continue-on-error`, the job still reported
        # success. That is the second way a real failure has gone invisible
        # here, so the cap now leaves room for the marker to be printed.
        timeout-minutes: 25
        # NOTE: `continue-on-error: true` means a genuine test failure STILL
        # reports this job as successful. A test target that did not compile
        # at all sat unnoticed behind it for some time. Making this blocking
        # is a policy decision for the repo owner, so it is left as-is and
        # flagged here rather than changed unilaterally.
        continue-on-error: true
        run: |
          # `-derivedDataPath build` reuses what the Build step already
          # produced. Without it this step re-built both targets from scratch,
          # which was ~8.5 of its 10 minutes and left the suite barely a minute
          # to run — run #89's log stops mid-suite for exactly that reason.
          # `-only-testing:VetCircuitTests` keeps this step's verdict about the
          # unit suite alone. `xcodebuild test` builds every test target before
          # running any, so when the UI target failed to compile it cancelled
          # the whole action and the 399-test unit suite silently did not run.
          # A problem in the UI walkthrough must not be able to hide the unit
          # results again.
          set -o pipefail
          xcodebuild test \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            -derivedDataPath build \
            -only-testing:VetCircuitTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit-tests.log

      - name: UI walkthrough
        # Drives the real app in the simulator — the only check that proves a
        # screen renders, a control is reachable, and a tap registers first
        # time. Kept in its own step so its failures are attributable and
        # cannot cancel the unit suite above.
        timeout-minutes: 25
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            -derivedDataPath build \
            -only-testing:VetCircuitUITests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-tests.log

      # The verdict, printed last so it is always in the tail of the log.
      #
      # This exists because a verdict that is only discoverable by trawling
      # the whole log is not discoverable at all. Both test steps are
      # `continue-on-error`, so the job's own badge says "success" whatever
      # happened; and the job log is large enough that the log API returns
      # only its tail, which repeatedly cut off the unit suite's
      # `Test run with N tests passed` line — leaving the actual result
      # unreadable while everything looked green. Running last means this
      # summary is in the tail by construction.
      #
      # `if: always()` so a timed-out or killed test step still gets a verdict
      # rather than silently producing none, which is the failure shape this
      # is here to remove.
      - name: Test verdict
        if: always()
        run: |
          # Set by `verdict` when a suite is anything other than demonstrably
          # passing. The step used to only print, so the job went green on a
          # red suite — both test steps are continue-on-error, so their own
          # "success" means nothing more than "the step ran".
          suites_bad=0

          verdict() {
            local name="$1" log="$2"
            if [ ! -f "$log" ]; then
              echo "$name: NO LOG — the step did not run or died before writing anything"
              suites_bad=1
              return
            fi
            local summary
            # Xcode 26's Swift Testing writes "Test run with 453 tests in 125
            # suites passed"; older toolchains wrote "…453 tests passed". The
            # optional middle clause matches both — without it this reported a
            # passing 453-test suite as possibly never having run.
            summary=$(grep -E "Test run with [0-9]+ tests( in [0-9]+ suites)? (passed|failed)" "$log" | tail -1 || true)
            local marker
            marker=$(grep -Eo "\*\* TEST (SUCCEEDED|FAILED) \*\*" "$log" | tail -1 || true)
            local xctest
            xctest=$(grep -E "Executed [0-9]+ tests, with [0-9]+ failure" "$log" | tail -1 || true)
            echo "$name:"
            echo "  marker : ${marker:-MISSING — the step was cut off before xcodebuild printed a verdict}"
            echo "  summary: ${summary:-none}"
            echo "  xctest : ${xctest:-none}"
            grep -c "✘" "$log" 2>/dev/null | sed 's/^/  failures (✘ lines): /' || true
            # The names, not just the count. Without these the only way to
            # learn *which* test failed is to download the full log, and the
            # artifact/log download host is not reachable from every
            # environment that needs to read this verdict.
            # When the summary line is missing we cannot tell a suite that
            # passed from a suite that never ran — "** TEST SUCCEEDED **"
            # prints for both, and a silently empty run is the exact failure
            # this whole step exists to stop. So show the tail and say so.
            # Only a real alarm when nothing ran under *either* framework:
            # an XCTest-only suite (the UI walkthrough) never emits a Swift
            # Testing summary, and saying it might not have executed while it
            # reports 21 passing tests is noise that trains you to ignore the
            # warning.
            if [ -z "$summary" ] && echo "$xctest" | grep -q "Executed 0 tests"; then
              echo "  NOTE   : no test-count line from either framework — this suite may not have executed."
              echo "  tail   :"
              grep -vE '^\s*$' "$log" | tail -8 | sed 's/^/    /'
            fi
            local failing
            failing=$(sed -n '/^Failing tests:/,/^$/p' "$log" | sed '1d;/^$/d' || true)
            if [ -n "$failing" ]; then
              echo "  failing:"
              echo "$failing" | sed 's/^[[:space:]]*/    - /'
            fi
            # The assertion itself, not just the test's name. XCTest writes
            # "<file>:<line>: error: -[Suite test] : <message>"; without this
            # the verdict says which test failed and nothing about why, and
            # the full log is not downloadable from every environment that
            # needs to read it. Truncated per line because a failure message
            # can carry a whole element tree.
            local assertions
            assertions=$(grep -E "^.*:[0-9]+: error: " "$log" | tail -5 || true)
            if [ -n "$assertions" ]; then
              echo "  assertions:"
              echo "$assertions" | cut -c1-500 | sed 's|^.*/||; s/^/    - /'
            fi

            # A suite counts as passing only on an explicit SUCCEEDED marker
            # with no failures recorded by either framework. Anything else —
            # a FAILED marker, a missing one because the step was cut off, a
            # non-zero failure count — fails the job. Silence is not success.
            case "$marker" in
              *"TEST SUCCEEDED"*) ;;
              *) suites_bad=1 ;;
            esac
            if echo "$summary" | grep -q "failed"; then suites_bad=1; fi
            if echo "$xctest" | grep -qE "with [1-9][0-9]* failure"; then suites_bad=1; fi
          }
          echo "=============== TOOLCHAIN ==============="
          xcodebuild -version 2>&1 | tr '\n' ' ' || true
          echo ""
          xcodebuild -showsdks 2>/dev/null | grep -iE "iphoneos|iphonesimulator" | head -6 || true
          echo "========================================"
          # Compiler errors first: if the build failed, nothing below ran and
          # this is the only thing worth reading.
          if [ -f build.log ]; then
            build_errors=$(grep -E "error:" build.log | sed 's/^ *//' | sort -u | head -40 || true)
            if [ -n "$build_errors" ]; then
              echo "=============== BUILD ERRORS ==============="
              echo "$build_errors"
              echo "==========================================="
            fi
          fi
          echo "=============== TEST VERDICT ==============="
          verdict "Unit tests" unit-tests.log
          verdict "UI walkthrough" ui-tests.log
          echo "==========================================="
          {
            echo "### Test verdict"
            echo '```'
            verdict "Unit tests" unit-tests.log
            verdict "UI walkthrough" ui-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The gate. Everything above this line is diagnostics; this is the
          # line that makes a red suite a red build.
          if [ "$suites_bad" -ne 0 ]; then
            echo "::error::Tests did not pass — see the verdict above."
            exit 1
          fi
          echo "Both suites passed."

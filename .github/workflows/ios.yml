name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-and-run:
    runs-on: macos-15
    # 25 was too tight once the suite grew: the app build takes ~6 min and the
    # test target's own build-for-testing another ~10, so the job was finishing
    # with no headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions and simulators
        run: |
          ls /Applications | grep Xcode || true
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project VetCircuit.xcodeproj

      - name: Pick and boot an available iOS Simulator
        id: destination
        timeout-minutes: 5
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Using device $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"

          for i in $(seq 1 30); do
            STATE=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['state'] for v in d.values() for x in v if x['udid'] == '$DEVICE_ID'), 'Unknown'))")
            echo "Simulator state: $STATE"
            if [ "$STATE" = "Booted" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Simulator did not reach Booted state in time" >&2
          exit 1

      - name: Build
        timeout-minutes: 10
        run: |
          xcodebuild build \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install and launch app on the booted simulator
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.destination.outputs.id }}"
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "VetCircuit.app" | head -1)
          echo "App path: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.vetcircuit.app
          sleep 5

          mkdir -p artifacts
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/vetcircuit-simulator.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vetcircuit-simulator-screenshot
          path: artifacts/vetcircuit-simulator.png

      - name: Unit tests
        # Executing the tests takes ~12 seconds; the rest is building the test
        # target. At 10 minutes xcodebuild was being killed during teardown,
        # before it printed `** TEST SUCCEEDED **` / `** TEST FAILED **` — and
        # because this step is `continue-on-error`, the job still reported
        # success. That is the second way a real failure has gone invisible
        # here, so the cap now leaves room for the marker to be printed.
        timeout-minutes: 25
        # NOTE: `continue-on-error: true` means a genuine test failure STILL
        # reports this job as successful. A test target that did not compile
        # at all sat unnoticed behind it for some time. Making this blocking
        # is a policy decision for the repo owner, so it is left as-is and
        # flagged here rather than changed unilaterally.
        continue-on-error: true
        run: |
          # `-derivedDataPath build` reuses what the Build step already
          # produced. Without it this step re-built both targets from scratch,
          # which was ~8.5 of its 10 minutes and left the suite barely a minute
          # to run — run #89's log stops mid-suite for exactly that reason.
          # `-only-testing:VetCircuitTests` keeps this step's verdict about the
          # unit suite alone. `xcodebuild test` builds every test target before
          # running any, so when the UI target failed to compile it cancelled
          # the whole action and the 399-test unit suite silently did not run.
          # A problem in the UI walkthrough must not be able to hide the unit
          # results again.
          xcodebuild test \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            -derivedDataPath build \
            -only-testing:VetCircuitTests \
            CODE_SIGNING_ALLOWED=NO

      - name: UI walkthrough
        # Drives the real app in the simulator — the only check that proves a
        # screen renders, a control is reachable, and a tap registers first
        # time. Kept in its own step so its failures are attributable and
        # cannot cancel the unit suite above.
        timeout-minutes: 25
        continue-on-error: true
        run: |
          xcodebuild test \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            -derivedDataPath build \
            -only-testing:VetCircuitUITests \
            CODE_SIGNING_ALLOWED=NO

name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-and-run:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions and simulators
        run: |
          ls /Applications | grep Xcode || true
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project VetCircuit.xcodeproj

      - name: Pick and boot an available iOS Simulator
        id: destination
        timeout-minutes: 5
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Using device $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"

          for i in $(seq 1 30); do
            STATE=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['state'] for v in d.values() for x in v if x['udid'] == '$DEVICE_ID'), 'Unknown'))")
            echo "Simulator state: $STATE"
            if [ "$STATE" = "Booted" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Simulator did not reach Booted state in time" >&2
          exit 1

      - name: Build
        timeout-minutes: 10
        run: |
          xcodebuild build \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install and launch app on the booted simulator
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.destination.outputs.id }}"
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "VetCircuit.app" | head -1)
          echo "App path: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.vetcircuit.app
          sleep 5

          mkdir -p artifacts
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/vetcircuit-simulator.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vetcircuit-simulator-screenshot
          path: artifacts/vetcircuit-simulator.png

      - name: Unit tests
        timeout-minutes: 10
        continue-on-error: true
        run: |
          xcodebuild test \
            -project VetCircuit.xcodeproj \
            -scheme VetCircuit \
            -destination "id=${{ steps.destination.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO

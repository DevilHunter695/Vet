name: Backend

# 61 migrations were written, reviewed and never once executed. Nothing in this
# repository could apply them, so "the schema is fine" was an assumption that
# had gone unchallenged for the whole life of the project — and the first three
# files to be run turned out to contain errors that made them impossible to
# apply anywhere, on any Postgres.
#
# This job exists so that can never be true again: every push applies every
# migration, in order, to a real Postgres, and then exercises the parts whose
# behaviour matters.

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  migrations-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Deliberately NOT continue-on-error. A migration that cannot apply is
      # not a warning — it is a deploy that will fail, found here instead of
      # at 2am.
      - name: Apply every migration, then exercise D6's trigger
        run: ./backend/test/apply_migrations.sh

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Eleven edge functions — the payment webhook, the signed-quote
      # generator, refunds, account export — have been written, reviewed and
      # never once type-checked, exactly as the migrations had never been
      # applied. `deno check` resolves their imports and type-checks them,
      # which is the whole of what can be verified without deploying them.
      #
      # Also not continue-on-error: a webhook handler that does not compile is
      # a payment that never gets confirmed.
      - name: Lint the edge functions
        working-directory: backend/supabase/functions
        run: deno lint

      # The payment webhook is the only place a payment is ever marked
      # succeeded, so its decisions get executed, not just compiled.
      - name: Test the edge functions
        working-directory: backend/supabase/functions
        run: deno test --allow-all

      - name: Type-check every edge function
        working-directory: backend/supabase/functions
        run: |
          set -euo pipefail
          failed=0
          for f in */index.ts; do
            if deno check --quiet "$f"; then
              echo "ok    $(dirname "$f")"
            else
              echo "FAIL  $(dirname "$f")"
              failed=1
            fi
          done
          echo
          echo "=========== EDGE FUNCTION VERDICT ==========="
          if [ "$failed" -eq 0 ]; then
            echo "  $(ls -d */ | wc -l | tr -d ' ') functions type-check clean"
          else
            echo "  at least one function failed to type-check (see above)"
          fi
          echo "============================================="
          exit "$failed"

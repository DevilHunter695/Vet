name: VetCircuit
options:
  bundleIdPrefix: com.vetcircuit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
targets:
  VetCircuit:
    type: application
    platform: iOS
    sources:
      - path: VetCircuit
        excludes:
          - Resources/Info.plist
      # The App Group payload, compiled into the app as well as the widget.
      # Declaring it once in each target is how the two copies drifted.
      - path: VetCircuitWidget/SharedVisitSummary.swift
      # Same reasoning for the Live Activity contract — ActivityKit only
      # needs both targets' types to be structurally identical, and the
      # surest way to guarantee that is for there to be only one of them.
      - path: VetCircuitWidget/VetEnRouteAttributes.swift
    resources:
      - path: VetCircuit/Resources
        excludes:
          - Info.plist
    info:
      path: VetCircuit/Resources/Info.plist
      properties:
        CFBundleDisplayName: VetCircuit
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "VetCircuit uses your photo library so you can share photos of your pet with your vet."
        NSFaceIDUsageDescription: "VetCircuit uses Face ID to keep your pet's medical records and account locked to you, when app lock is turned on."
        # O2: English + Hindi at launch (Localizable.xcstrings under
        # Resources). Coverage is partial by design — see TECHNICAL_PLAN.md's
        # O2 note for exactly which screens are fully localized.
        CFBundleLocalizations:
          - en
          - hi
        APP_STORE_ID: "$(APP_STORE_ID)"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    # Without this, `xcodegen generate` would drop any xcconfig you attached by
    # hand in Xcode, and the app would silently rebuild against the empty
    # SUPABASE_* defaults below — i.e. permanently stuck on mock data. Copy
    # Config.template.xcconfig to Config.xcconfig (gitignored) to fill it in.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vetcircuit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APP_STORE_ID: ""
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
    # N6: shared App Group so the widget extension can read the
    # `SharedVisitSummary` the main app writes on refresh — see
    # VetCircuit/Data/WidgetData/WidgetDataBridge.swift.
    entitlements:
      path: VetCircuit/VetCircuit.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.vetcircuit.app
        aps-environment: development
    dependencies:
      - package: Supabase
      - target: VetCircuitWidgetExtension
        embed: true
        codeSignOnCopy: true
    scheme:
      testTargets:
        - VetCircuitTests
        - VetCircuitUITests
      gatherCoverageData: true
  # An automated walkthrough of the running app. Unit tests prove the domain
  # logic; only driving the real UI proves a screen renders, a control is
  # reachable, and a tap actually registers — which is exactly what went
  # unverified while a dead test target and a `continue-on-error` CI step hid
  # everything.
  VetCircuitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VetCircuitUITests
    dependencies:
      - target: VetCircuit
    settings:
      base:
        TEST_TARGET_NAME: VetCircuit
  VetCircuitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VetCircuitTests
    dependencies:
      - target: VetCircuit
  VetCircuitWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: VetCircuitWidget
    info:
      path: VetCircuitWidget/Info.plist
      properties:
        CFBundleDisplayName: VetCircuit Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VetCircuitWidget/VetCircuitWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vetcircuit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vetcircuit.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"

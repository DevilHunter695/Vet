name: VetCircuit
options:
  bundleIdPrefix: com.vetcircuit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
targets:
  VetCircuit:
    type: application
    platform: iOS
    sources:
      - path: VetCircuit
        excludes:
          - Resources/Info.plist
    resources:
      - path: VetCircuit/Resources
        excludes:
          - Info.plist
    info:
      path: VetCircuit/Resources/Info.plist
      properties:
        CFBundleDisplayName: VetCircuit
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "VetCircuit uses your camera to let you attach photos of your pet to chat with your vet."
        NSPhotoLibraryUsageDescription: "VetCircuit uses your photo library so you can share photos of your pet with your vet."
        NSLocationWhenInUseUsageDescription: "VetCircuit uses your location to show nearby vet circuits and let you track your vet's arrival."
        NSUserTrackingUsageDescription: "VetCircuit does not track you across other apps or websites."
        NSFaceIDUsageDescription: "VetCircuit uses Face ID to keep your pet's medical records and account locked to you, when app lock is turned on."
        # O2: English + Hindi at launch (Localizable.xcstrings under
        # Resources). Coverage is partial by design — see TECHNICAL_PLAN.md's
        # O2 note for exactly which screens are fully localized.
        CFBundleLocalizations:
          - en
          - hi
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vetcircuit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
    # N6: shared App Group so the widget extension can read the
    # `SharedVisitSummary` the main app writes on refresh — see
    # VetCircuit/Data/WidgetData/WidgetDataBridge.swift.
    entitlements:
      path: VetCircuit/VetCircuit.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.vetcircuit.app
    dependencies:
      - package: Supabase
      - target: VetCircuitWidgetExtension
        embed: true
        codeSignOnCopy: true
    scheme:
      testTargets:
        - VetCircuitTests
      gatherCoverageData: true
  VetCircuitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VetCircuitTests
    dependencies:
      - target: VetCircuit
  VetCircuitWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: VetCircuitWidget
    info:
      path: VetCircuitWidget/Info.plist
      properties:
        CFBundleDisplayName: VetCircuit Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VetCircuitWidget/VetCircuitWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vetcircuit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vetcircuit.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
